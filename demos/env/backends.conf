# Backend addresses for the demos env. All point at localhost so host-side
# handlers reach docker-compose services via the published port mappings.
# Section name must match the hostname in routes.conf.

[mylocal.kafka]
bootstrap = localhost:9092

[mylocal.redis]
host = localhost
port = 6379

[mylocal.mongo]
uri = mongodb://localhost:27017

[mylocal.postgres]
dsn = postgresql://demo:demo@localhost:5433/demo

[mylocal.mysql]
host     = localhost
port     = 3307
user     = demo
password = demo
database = demo

[mylocal.clickhouse]
upstream = http://localhost:8123
user     = demo
password = demo
database = demo

[mylocal.memcached]
host = localhost
port = 11211

[mylocal.mqtt]
url      = mqtt://localhost:1883
# An AsyncAPI document makes GET /_info list channels with example curls.
# Path is relative to where `make demos-install` copies it; see Makefile.
asyncapi = ${JCI_HOME}/envs/demos/home-asyncapi.json
validate = true     # POSTs to channels in the spec are checked against the message schema

[mylocal.rabbit]
url      = amqp://guest:guest@localhost:5672/
mgmt_url = http://guest:guest@localhost:15672

[mylocal.smtp]
smtp_host = localhost
smtp_port = 1025
ui_url    = http://localhost:8025

[mylocal.grpc]
address = localhost:50051

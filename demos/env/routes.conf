# jci 'demos' env. Each route maps a fake hostname to a handler from the
# library (`jci handler ls`); the handler talks to the matching service over
# its native wire protocol. Backend addresses live in backends.conf.
#
# Handlers with dependencies need `jci handler install <name>` first --
# `make demos-install` does that for all of them.

mylocal.hello       ${JCI_HANDLERS}/run hello
mylocal.shim        ${JCI_HANDLERS}/run shim-meta
mylocal.kafka       ${JCI_HANDLERS}/run kafka
mylocal.redis       ${JCI_HANDLERS}/run redis
mylocal.mongo       ${JCI_HANDLERS}/run mongo
mylocal.postgres    ${JCI_HANDLERS}/run postgres
mylocal.rabbit      ${JCI_HANDLERS}/run rabbit
mylocal.smtp        ${JCI_HANDLERS}/run smtp
mylocal.grpc        ${JCI_HANDLERS}/run grpc
